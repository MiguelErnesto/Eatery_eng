services:
  mysql:
    image: mariadb:10.2
    pull_policy: never
    container_name: eatery-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: eatery
    volumes:
      - eatery-mysql-data:/var/lib/mysql

volumes:
  eatery-mysql-data:
